    # ── Per-lane headroom-floor exceptions (mechanism: loom#1355) ──────
    # A DECLARED, TIME-BOUNDED, per-lane relaxation of the `headroom_floor_pct`
    # declared in the per-CLI blocks above. Declared once at the
    # `context/root.md` level (NOT duplicated per CLI) so the codex/gemini
    # parity contract cannot drift between two copies; each entry names the
    # CLIs it covers explicitly via `clis:`.
    #
    # This is the ONLY mechanism by which a lane may emit below the 10%
    # Risk-0004 reserve floor. It is fail-CLOSED in three independent ways
    # (`emit.mjs`): a lane with NO matching entry is enforced at the full
    # floor; a matching entry whose `expires` date has PASSED resolves to
    # null and the lane reverts to the full floor (the gate turns RED again —
    # an exception never lapses into permission); and a MALFORMED entry makes
    # `parseHeadroomExceptions` THROW, halting emission rather than degrading
    # into "no floor". `granted_floor_pct` is then bounded on BOTH sides, by
    # two DIFFERENT mechanisms that an earlier revision of this comment
    # conflated as one "clamp" (corrected 2026-08-29, #1953 — the wrong word
    # cost a full measurement cycle):
    #   - FROM BELOW, at parse time: a grant below
    #     `HEADROOM_EXCEPTION_MIN_FLOOR_PCT` (5) makes
    #     `parseHeadroomExceptions` THROW. It does NOT clamp to 5 and carry
    #     on — the emission dies, and every lane dies with it, because the
    #     stanza is parsed once for all lanes. A lane needing a floor below
    #     5% therefore CANNOT be granted one at all; see the rs NOTE below.
    #   - FROM ABOVE, at apply time: `effectiveHeadroomFloorPct` returns
    #     `min(base_floor, granted)`, so a nonsense grant ABOVE the base
    #     floor is ignored rather than silently TIGHTENING it. This one IS a
    #     clamp.
    # Neither can reach the hard `block_cap_bytes` gate, which stays
    # independent.
    #
    # An exception FREEZES a lane at its measured state — it is NOT a budget
    # to spend. `granted_floor_pct` is set just under the lane's MEASURED
