    # ── Per-lane, per-rule BUDGET exceptions (loom#1355) — RETIRED 2026-09-02
    # The sibling instrument to `headroom_floor_exceptions` above, one
    # measurement surface DOWN: that stanza governs a lane's AGGREGATE emission
    # against `block_cap_bytes`; this one governs a SINGLE rule against its
    # `per_rule_size_budget_bytes` entry.
    #
    # THE MECHANISM IS LIVE; NO ENTRIES ARE DECLARED. That is a deliberate
    # state, not an omission. `parsePerRuleBudgetExceptions` reads an ABSENT
    # stanza as [] — "no exceptions, every rule at its flat ceiling" — which is
    # the fail-CLOSED default rather than a degraded mode, and emit-shape.test
    # pins it directly (`parsePerRuleBudgetExceptions("cli_variants:\n  context/root.md:\n")`
    # deepEquals []). To declare a future exception, re-add a
    # `per_rule_budget_exceptions:` key here holding a sequence of entries
    # carrying the fields the parser REQUIRES — lane, clis, rule,
    # granted_block_ceiling_bytes, expires, issue — plus a rationale.
    #
    # THE PARSER-REQUIRED SET IS NOT THE SUFFICIENT SET. `emit.mjs` treats
    # `measured_emission_bytes`, `base_budget_bytes_at_grant` and `granted_on`
    # as OPTIONAL (absent -> null), so a grant that omits them parses fine and
    # carries no measurement anchor at all. Those three are what make an entry a
    # FREEZE rather than a budget, and the test that used to enforce them was
    # deleted WITH the last declaration. A re-declaration MUST therefore carry
    # them AND land with a re-authored anchoring test asserting
    # grant >= measured and a slack bound; see the closure-by-deletion note in
    # emit-shape.test.mjs. Declaring a grant without that test is how the freeze
    # doctrine below becomes unenforced prose.
    #
    # AND EXPECT A RED THE MOMENT YOU DO. The successor guard named below opens
    # with an assertion that NO security.md grant is declared
    # (`exceptions.filter(e => e.rule === "security.md").length === 0`), so a
    # re-declaration for that rule reds emit-shape.test.mjs immediately. That is
    # BY DESIGN — it forces the re-authored anchoring test to arrive with the
    # grant rather than after it — and it is stated HERE, at read time, because
    # a guard discoverable only at failure time is one a declarer meets as a
    # mystery instead of an instruction.
    #
    # Every fail-closed axis of the mechanism is unchanged and still enforced on
    # every emission: a rule with no matching entry is enforced at the flat
    # ceiling; an entry whose `expires` has PASSED resolves to null and the rule
    # reverts to the flat ceiling (the gate turns RED again — an exception never
    # lapses into permission); a MALFORMED entry makes
    # `parsePerRuleBudgetExceptions` THROW rather than degrade into "no
    # ceiling"; an entry naming a rule with NO declared budget THROWS; and a
    # grant above 2x the declared budget THROWS (past that the budget itself is
    # wrong — re-measure per spec v6 §A.2 — and a waiver is the wrong
    # instrument). An exception raises only the BLOCK ceiling; the ±30% WARN
    # band is untouched. An exception FREEZES a rule at its measured size — it
    # is NOT a budget to spend.
    #
    # ── WHAT WAS RETIRED ───────────────────────────────────────────────
    # The sole entry was: lane rs, clis [codex, gemini], rule security.md,
    # granted_block_ceiling_bytes 9475, granted_on 2026-07-26,
    # expires 2026-10-31, issue 1355. At grant time rs security.md measured
    # 9,545 B against the flat 9,360 B ceiling — a REAL 185 B overrun the grant
    # existed to absorb, and it was load-bearing then.
    #
    # It stopped being load-bearing long before it was removed, and this stanza
    # said so in its own text ("THIS GRANT IS VESTIGIAL AND NO LONGER FREEZES
    # ANYTHING", `measured_overrun_bytes: -65`), naming retirement as "the
    # correct eventual disposition" and deferring it under #2018 AC-4. The
    # #1953 shed lanes then cut rs security.md 9,295 B -> 8,985 B, i.e. 375 B
    # UNDER the flat ceiling, which made the deferral unpayable.
    #
    # ── WHY RETIREMENT AND NOT RE-ANCHORING ────────────────────────────
    # Re-anchoring was attempted first and REFUSED as unsatisfiable — not merely
    # unattractive. The argument is DOCTRINAL, and is stated that way
    # deliberately: `emit.mjs::effectivePerRuleBlockCeiling` resolves the
    # effective ceiling as max(flatCeiling, grant), so a grant is either
    # <= the flat ceiling (INERT — it raises a bar nothing reaches) or
    # > the flat ceiling (a GROWTH ALLOWANCE above what the un-excepted gate
    # permits). The freeze doctrine stated above forbids the second outright:
    # "An exception FREEZES a rule at its measured size — it is NOT a budget to
    # spend." For a rule ALREADY clearing the flat ceiling, both branches are
    # therefore inadmissible, and no choice of numbers escapes that.
    #
    # Stated this way ON PURPOSE. An earlier draft of this record rested the
    # case on arithmetic instead — the suite required grant >= measured AND
    # grant - measured < 200, forcing the grant into [8,985, 9,184], entirely
    # below 9,360, so no admissible value remained. That is TRUE but CONTINGENT:
    # the 200 was a test-local constant, and a future reader could "solve" it by
    # relaxing the slack to 500 and re-anchoring — handing this lane 400+ B of
    # un-gated baseline growth, the exact pathology the retired stanza spent
    # sixty lines lamenting. The doctrinal form closes that door; the arithmetic
    # is kept only as corroboration.
    #
    # No lane loses a protection it relied on. base/py/prism were never covered
    # by this entry and always cleared the flat ceiling unaided — and rs now
    # clears the SAME flat 9,360 B ceiling as its siblings. Note base and py
    # emit the same composed rule (7,215 B each). prism did NOT — it carried its
    # own overlay at variants/prism/rules/security.md and emitted 3,792 B — but
    # that lane was RETIRED 2026-09-02 (#2085) and `variants/prism/` no longer
    # exists, so the prism clause is history, not live state.
    # Said precisely because an earlier draft here claimed all three "emit the
    # same rule", which is false for prism and is the kind of unmeasured
    # side-claim this repo treats as load-bearing. The replacement guard is
    # emit-shape.test.mjs "#1355 RETIRED — security.md clears the FLAT per-rule
    # ceiling on EVERY lane, unaided", which REDS if any lane regrows past the
    # flat ceiling, i.e. if the condition that once justified a grant returns.
    #
    # `.claude/test-harness/ratchet-registry.json` DELIBERATELY keeps its
    # `per-rule-budget-exception-granted-block-ceiling` row: it is a dormant
    # may-only-fall ratchet that re-arms the instant an entry is declared here
    # again. With no stanza present it reports UNKNOWN on the head side, which
    # `check-ratchet-monotonicity.mjs` reports and explicitly does not score.

  # agents/**.md — TOML-header safety for codex-ingested agent files.
  # v3 §2.2 change: moved from regex-match to iterate+classify to
  # correctly handle quoted agent names containing special chars.
  agents/**.md:
    codex:
      toml_key_safety: "iterate_and_classify"
      toml_key_rule: |
        For each emitted .codex/agents/<name>.toml:
          require name, description, developer_instructions strings
          require filename/name identity and valid native TOML
          inherit parent model unless explicitly configured by the operator

  # Native hooks invoke the shared policy library; an independent MCP server
  # registration does not intercept native tool calls.
  hooks/*.js:
    codex:
      feature_flag_required: "hooks"
      native_registration: ".codex/hooks.json"
      policy_adapter: "hooks/lib/codex-native-policy.js"
      policy_library: ".codex-mcp-guard/server.js"
      coverage_scope: "PreToolUse local tools selected from delivered settings; hosted tools excluded; other lifecycle events require their own registrations"
      coverage_equivalence_validator: "emit_step_4.4.13"

  # Interactive phase procedures are explicit coc-<phase> skills under
  # .agents/skills; bin/coc loads their instructions for structured headless runs.
  # .codex/prompts remains compatibility input, never native slash discovery.

# ─────────────────────────────────────────────────────────────────
# PARITY ENFORCEMENT (Phase E1 — per spec v6 §5 + cross-cli-parity.md)
# ─────────────────────────────────────────────────────────────────
# Cross-CLI drift audit configuration. Consumed by /cli-audit (Phase E5)
# via cli-orchestrator.sees verb (spec v6 §6.2). Drift in neutral-body
# HARD BLOCKS sync; drift in examples SOFT WARNS. Scrub tokens eliminate
# false-positive drift from delegation-syntax divergence.
#
# Contract source of truth: rules/cross-cli-parity.md.

cli_emit_exclusions:
  codex:
    - skills/30-claude-code-patterns/**
    - skills/co-reference/**
    # skills/maintenance-sweep/** is a loom-only skill (see loom_only: below). skills/test-harness-probe/**
    # is now BUILD-CC-only (sync-from-backlog-0552 (b)) — declared here so it emits to CC only, NOT codex.
    # Both recorded for the mirror-exclusion check (2026-07-05, V15 orphan fate). NOTE: entries here carry
    # NO inline comment — parseEmitExclusions captures the whole value, so the glob MUST stand alone.
    - skills/test-harness-probe/**
    # commands/test-harness-probe.md — BUILD-CC-only (sync-from-backlog-0552 (b)): probe orchestrator
    # dispatches CC subagents; ships to BUILD via coc-core (CC), fenced from this CLI's emission.
    # Glob MUST stand alone (no inline comment) per the contract above.
    - commands/test-harness-probe.md
    - skills/maintenance-sweep/**
    - skills/publish-template/**
    - skills/policy-distillation/**
    # skills/fork-conference/** is a loom-only skill (see loom_only: below). A loom_only
    # COMMAND needs no entry here (emit-cli-artifacts honours loom_only for commands), but a
    # loom_only SKILL does — the two surfaces differ, and carrying the command's reasoning
    # across to the skill is what left this list short and turned validate-emit's
    # mirror-exclusion check red. Glob MUST stand alone (no inline comment) per the contract above.
    - skills/fork-conference/**
    - agents/cc-architect.md
    - agents/gemini-architect.md
    # W4 D1 (validate-coc-parity): per-CLI architects + cli-orchestrator are loom AUTHORING
    # agents (self-reference / multi-CLI meta), NOT downstream codex specialists. Mirrors
    # emit-cli-artifacts CODEX_AGENT_STRUCTURAL_EXCLUSIONS so .coc/ computeAppliesTo matches
    # legacy per-CLI emission.
    - agents/codex-architect.md
    - agents/cli-orchestrator.md
    # variant_only artifacts reach the CC lane ONLY. The per-CLI emitter reads the
    # GLOBAL agents/ tree; a variant_only file lives under variants/<lang>/ and is
    # ADDED to the target by the sync overlay, so the emitter never sees it and it
    # silently reaches no non-CC lane. Declared here so the CC-only fate is stated
    # rather than silent (Gate-1 USE-py item 9; "either is acceptable, silence is
    # not"). Measured on a fresh --target py emit: infrastructure-specialist absent
    # from codex/prompts/ AND gemini/agents/, control dataflow present on both.
    # This is the DECLARATION half only; feeding variant_only into the per-CLI
    # corpus is emitter work tracked with the A2/A3/A5/A6/A7/A8 workstream.
    # Glob MUST stand alone (no inline comment) per the contract above.
    - agents/frameworks/infrastructure-specialist.md
    - rules/cc-artifacts.md
    - guides/claude-code/**
    - commands/cc-audit.md
  gemini:
    - skills/30-claude-code-patterns/**
    - skills/co-reference/**
    # skills/maintenance-sweep/** is a loom-only skill (see loom_only: below). skills/test-harness-probe/**
    # is now BUILD-CC-only (sync-from-backlog-0552 (b)) — declared here so it emits to CC only, NOT gemini.
    # Both recorded for the mirror-exclusion check (2026-07-05, V15 orphan fate). Globs stand alone (no inline comment).
    - skills/test-harness-probe/**
    # commands/test-harness-probe.md — BUILD-CC-only (sync-from-backlog-0552 (b)): probe orchestrator
    # dispatches CC subagents; ships to BUILD via coc-core (CC), fenced from this CLI's emission.
    # Glob MUST stand alone (no inline comment) per the contract above.
    - commands/test-harness-probe.md
    - skills/maintenance-sweep/**
    - skills/publish-template/**
    - skills/policy-distillation/**
    # skills/fork-conference/** — same fate, same reason as the codex list above: a loom_only
    # SKILL needs an explicit exclusion entry even though a loom_only COMMAND does not.
    # Glob MUST stand alone (no inline comment) per the contract above.
    - skills/fork-conference/**
    - agents/cc-architect.md
    - agents/codex-architect.md
    # W4 D2 (validate-coc-parity): per-CLI architects + cli-orchestrator are loom AUTHORING
    # agents (self-reference / multi-CLI meta), NOT downstream gemini specialists. Mirrors
    # emit-cli-artifacts GEMINI_AGENT_STRUCTURAL_EXCLUSIONS so .coc/ computeAppliesTo matches
    # legacy per-CLI emission.
    - agents/gemini-architect.md
    - agents/cli-orchestrator.md
    # variant_only artifacts reach the CC lane ONLY — mirror of the codex entry
    # above; see its comment for the mechanism and the measurement (Gate-1 USE-py
    # item 9). Declared on BOTH per-CLI lists because the drop is symmetric: the
    # emitter's blindness to variants/ is not CLI-specific.
    # Glob MUST stand alone (no inline comment) per the contract above.
    - agents/frameworks/infrastructure-specialist.md
