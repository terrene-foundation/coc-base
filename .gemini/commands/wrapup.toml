name = "wrapup"
description = "Close the session: sweep-gated notes, the container backlog, the burndown chart, and a /pickup handoff block."
prompt = '''
Close the session so a fresh one resumes producing work within 2–3 minutes, and so **nothing open lives only in session context**. Two deliverables: the `.session-notes` fragment, and the paste-able **handoff block** (§ Handoff block) the operator pastes into `/pickup` after `/clear`.

**Before running:** if significant decisions, discoveries, or risks are not yet in `journal/`, run `/journal new DECISION|DISCOVERY|RISK <topic>` first. `.session-notes` is not a decision log.

## Arguments

Parse `$ARGUMENTS`. Recognized forms — anything else is a **LOUD REFUSAL**: name the unrecognized token, print this list, write nothing, stop. Silently falling back to a full run is BLOCKED — an operator who mistyped a flag gets a wrapup they did not ask for and never learns the flag was wrong.

- **empty** — full wrapup. The default and the expected form.
- **`--carry "<text>"`** — carry the operator's free-form text into **Next-session directives as entry 1, verbatim**. It still needs a re-validation check: if you cannot write one, put the text in **Traps**, say so in the reply, and do not silently promote it. Composes with `--no-sweep`.
- **`--handoff`** — re-emit the handoff block for the fragment ALREADY written this session. No re-write, no events, no census, no gate, no sweep step; tool-call cap **1** (read the fragment). Composes with nothing. Use when the block was lost from the terminal.
- **`--no-sweep <reason>`** — skip the sweep step and proceed with no receipt. `<reason>` is REQUIRED, is recorded verbatim in the notes as a named gap, and appears in the handoff block. Omitting it is a refusal, not a default.

## Gate: a same-day `/sweep` receipt — produced here when missing (MUST)

`/sweep` is the outstanding-work audit and remains the **sole measurer** — this command never re-measures what `/sweep` audits. The gate is **structural** and **chained**: with no receipt, `/wrapup` runs the sweep as its own step and then gates on the receipt that step produced.

Run the close-out gate — ONE tool call (slot (e) below), exactly these three commands, nothing else. The first is the repo's container-census enumerator: **where the repo ships one, drive it** (`rules/wip-discipline.md` MUST-8 names the canonical enumerator and its JSON shape); **where it ships none, enumerate by hand** in that same call — `git for-each-ref` with each ref's creator date, `git worktree list`, `git stash list` — and record every class you could not reach as UNKNOWN.

```bash
<the repo's container-census enumerator, or the by-hand enumeration above>
find . -maxdepth 1 -name 'SWEEP-*.md' -newermt "$(date +%F)" -print; find workspaces -maxdepth 3 -name 'sweep-*.md' -newermt "$(date +%F)" -print
find . -maxdepth 1 -name 'SWEEP-*.md' -print -quit
```

Read the LINES in this order, never an exit code (`rules/instrument-discipline.md` MUST-1/MUST-3):

1. **Control (3rd command) EMPTY** ⇒ the matcher does not fire here ⇒ the verdict is **UNKNOWN, never "no sweep"**. Report UNKNOWN and stop.
2. **Control non-empty, fresh set (2nd command) EMPTY** ⇒ with `--no-sweep <reason>`, proceed and record the reason. Otherwise run the **sweep step**, which is neither optional nor abridged: **(a)** run `/sweep` in full as its own step — invoke it by name where the CLI exposes commands as invokable skills, otherwise read `commands/sweep.md` and execute its Workflow, Output and Closure — so every sweep runs and its report is written AND committed exactly as that command requires; **(b)** show the operator that report's **Decision points** section verbatim, each with its recommended disposition; **(c)** re-run the SAME three-command gate once (slot (e′)) and read its lines from step 1 again. Fresh set STILL empty ⇒ **REFUSE**, naming what the sweep step failed to produce; writing the fragment is BLOCKED.
3. **Fresh set non-empty** ⇒ cite the newest path as the receipt and CONSUME the sweep's findings rather than re-deriving them.

The sweep step runs BEFORE the write phase and is `/sweep`'s procedure, not this command's, so the § Hard rules cap does not govern it. Why chained rather than refused or inlined, the ISO threshold, and the honest limit of the gate: `skills/wrapup/SKILL.md` § 7.

## What ONLY wrapup provides

Do NOT duplicate what the next session reads directly (commits/diffs, `todos/active/`, `journal/`, phase outputs, `specs/`, `CLAUDE.md` — per-surface detail: `skills/wrapup/SKILL.md` § 1). Five things nothing else captures:

1. **Priority ordering** — which files the next session reads first, in what order.
2. **In-flight state** — true RIGHT NOW, not yet committed, journaled, or filed.
3. **Traps** — pitfalls the next session walks into without warning.
4. **Outstanding ledger (forest)** — the durable cumulative forest record, reconciled by EMITTING EVENTS (§ Outstanding ledger reconciliation); the ledger is a projection of that log and is never written here.
5. **Container disposition** — every container the census found, LANDED / KILLED-with-reason / CARRIED-with-named-reason (§ Container census).

If content fits none of the five, it belongs elsewhere. Put it there BEFORE running `/wrapup`.

**Release-drift (packaging repos only).** CONSUME the `[RELEASE-DRIFT]` lines already in session-start context; re-running the checker here is BLOCKED by the cap. It always prints ≥1 line and always exits 0, so **zero output is a FAILED INVOCATION, not an all-clear** — report UNKNOWN, never clean (`rules/evidence-first-claims.md` MUST-3). Reading the output: `skills/wrapup/SKILL.md` § 6.

## Container census — every open container is SHOWN and DISPOSITIONED (MUST)

The gate's first command produces the census: EVERY ref namespace, plus registered / detached / STRAY worktrees and stashes, partitioned into `container` | `anchor` | `unclassified` against the declared policy. The contract, the enumerator per class, and why one namespace read as the whole forest is not a census are `rules/wip-discipline.md` MUST-8's and are not restated here. Four MUSTs bind the close-out:

- **Every CONTAINER carries a disposition** — `landed`, `killed (<reason>)`, or `carried (<named reason>)`. There is no fourth and no age carve-out: a container is never a resting state (`rules/wip-discipline.md` MUST-1). UNDETERMINED is recorded verbatim; reporting "none" without the census is BLOCKED.
- **The backlog is SHOWN, not only counted.** The close-out reply lists one row per CONTAINER: name · class (ref namespace, or registered / detached / stray tree, or stash) · age as the census reports it (`unknown` where it carries none) · disposition. Rows MAY group by class and disposition, but every container's name appears; a totals-only reply is BLOCKED. The fragment and handoff block carry the totals plus the killed and carried rows. Row sourcing: `skills/wrapup/SKILL.md` § 9.
- **Every class the census could not measure is recorded as UNKNOWN, never folded into a clean total.** Remote-tracking refs are the standing example: the local cache is not the remote, so that class is unmeasured unless the census was asked to query. NAME each unmeasured class and what it would take to measure it. Writing a clean container line over an incomplete census is BLOCKED — a partial sweep and a genuinely clean forest emit identical output.
- **ANCHORS and `unclassified` are reported apart**, never counted as containers.

Quote the census figures VERBATIM (§ Hard rules, generated-figure carve-out). Recomputing, rounding or re-wording one converts it into a memory-sourced claim and is BLOCKED.

## Burndown chart — generated, quoted verbatim (MUST)

Render it ONCE, as slot (f), BEFORE slot (b)'s emission — one tool call, two commands: `node .claude/bin/burndown-build.mjs` (print mode, writes nothing), then `node .claude/bin/burndown-build.mjs --quote "ALL PAGES/Open"`. Capture each exit code directly, never through a pipe, then read the lines:

- **Exit 0** ⇒ the REPLY carries the printed block VERBATIM, from its `BURNDOWN:BEGIN` marker to its `BURNDOWN:END` marker; the fragment's Burndown section carries the `--quote` line and the block's `generated_from_sha:` line, both verbatim; the handoff's BURNDOWN line carries the same `--quote` line with only its backticks removed.
- **Exit 2** (`UNRUNNABLE`, e.g. no committed burndown manifest) ⇒ quote the refusal line verbatim and show NO figures.
- **Any other exit, or empty output** ⇒ the chart is **UNKNOWN**, never "no open work".

Recomputing, re-typing, rounding or summarising a row, or quoting a stored block instead of this render, is BLOCKED (`rules/burndown-integrity.md` MUST-1). Why each surface carries the form it does, why before the emission, and why removing backticks is the one permitted change: `skills/wrapup/SKILL.md` § 9.

## Handoff block — the paste-able deliverable (MUST)

Emit ONE self-contained block, in the chat reply AND as the last section of the fragment. It is a handoff SOCKET: the operator runs `/clear`, starts the next session with `/pickup`, and pastes the block as its argument — so it MUST be intelligible with zero surrounding context and MUST survive being passed as an argument: **no backticks, no code fences, no triple quotes inside the block**.

The `START HERE:` and `LAND FIRST:` lines are FIXED and always present, in every block, in every mode. Omitting or re-wording either is BLOCKED: the first is how the operator learns the resume command and that `/pickup` applies the owner's standing block, which is never pasted by hand or duplicated here; the second is how the landing directive reaches the next session and every lane brief derived from it.

```
=== HANDOFF <YYYY-MM-DD> <display_id> ===
START HERE: run /clear, then start the next session with /pickup and paste this whole block as its argument; /pickup applies the owner's standing block itself.
LAND FIRST: finished work lands on dev - the integration trunk, or the default branch where no dev
exists - in the session that finishes it. Every backlog and current local or remote branch, ref,
worktree and stash is a CONTAINER, not a resting state - land it and drain it the moment its work
is done. Carry this line into every delegation brief.
READ FIRST: <path> - <why> | <path> - <why> | <path> - <why>
DIRECTIVES:
  1. <imperative order> - re-validate: <command> -> <result meaning STILL TRUE>
  (or: none - nothing carries forward)
CONTAINERS: <n> container(s) - <k> landed, <k> killed, <k> carried; UNKNOWN: <classes or none>
BURNDOWN: <the --quote line, backticks removed> | generated_from_sha: <sha> (or: UNRUNNABLE - refusal quoted in the fragment | UNKNOWN)
SWEEP: <newest receipt path> (or: NONE - <the --no-sweep reason>)
OPEN WORK LIVES IN: burndown/events.jsonl (forest) | todos/active/ (items) | journal/ (decisions)
TRAPS: <one line each, or none>
=== END HANDOFF ===
```

**Delegation propagation (MUST).** Any delegation brief this session causes to be written carries the `LAND FIRST:` line verbatim in its curated rule-slice (`rules/governed-throughput.md` MUST-1). A lane that never loads it leaves its work in a container — the carry-into-delegation obligation `rules/autonomous-execution.md` states for root-cause fixes, applied to landing.

## Where to write — M6 D split layout (root-canonical)

Per-operator fragment `<base>/.session-notes.d/<display_id>.md` — the surface `/wrapup` WRITES — plus the forest ledger `<base>/.session-notes.shared.md`, which `/wrapup` does NOT write. **The ledger is a DERIVED PROJECTION** (`rules/knowledge-convergence.md` MUST-1): transitions are appended as signed events to `burndown/events.jsonl` via `.claude/hooks/lib/burndown-events.js::appendEvent`, and the ledger is REGENERATED from `foldEvents`. Hand-writing a ledger row here is BLOCKED — the next regeneration reverts it and the work it recorded is lost with no diff. The `owner:` cell renders from the event's signer, not stamped here. **`<base>` is ALWAYS the repo ROOT**, never a workspace dir, even when a workspace is active: SessionStart regenerates only the root aggregate and the workspace read-path has no `.session-notes.d/` awareness, so a fragment written under `workspaces/<ws>/.session-notes.d/` is invisible to the next session — its body lands where nothing is surfaced (journal `0417`). Workspace locality rides the ledger rows and the "Read first" pointers, NOT the fragment's location. Writes go through `.claude/hooks/lib/session-notes-layout.js`. Events MUST carry a stable single-token `item_id` + `value_anchor` (`rules/value-prioritization.md` MUST-1+2); the projected row renders both verbatim. On journal-file close, emit a signed `journal-body-anchor` record via `.claude/hooks/lib/journal-body-anchor.js::buildAnchorRecord` — pins `{path, sha256_of_content_bytes, slot_record_ref}`; the fold-time predicate re-hashes and surfaces tamper on mismatch.

## Format

Length is bounded by `rules/session-notes-continuity.md` MUST-3 — target and ceiling live THERE and are deliberately not restated, so the two surfaces cannot drift. Overflow means the content belongs in `todos/active/` or `journal/`. The emitted scaffold — every section in order, with its inline guidance and its `re-check:` lines — is `skills/wrapup/SKILL.md` § 8; render from there, never from memory. The obligations that scaffold encodes stay HERE:

- **Section order** — Next-session directives → Where we are → Read first → In-flight state → Container census → In-play branches and worktrees → Burndown → Executed this session → Wave tracker → Outstanding ledger → Traps → Open questions for the human → Handoff. The directives come FIRST because they are the one imperative surface (`rules/session-notes-continuity.md` MUST-1); the handoff block comes LAST because it is what the operator copies.
- **Omit any empty section — EXCEPT the eight always-present ones**, which write an explicit empty-sentinel rather than vanish: **Next-session directives** ("None — nothing carries forward"), **Read first** (the mandatory entry point), **Container census**, **In-play branches and worktrees** ("None — nothing in play"), **Burndown** (the `--quote` line, the refusal line, or UNKNOWN), **Outstanding ledger** ("Forest empty — …"), **Executed this session** ("None — no external actions this session"), **Wave tracker** ("None — no waves in flight"). Absence of any of the eight is indistinguishable from a forgotten section, so it MUST be explicit.
- **Every row naming a durable surface carries its `re-check:` command**, authored for the NEXT session to run — never run here (§ Hard rules, cap).

## Outstanding ledger reconciliation (MUST — every wrapup)

The ledger defends against the stale-snapshot trap (`journal/0089`). **Reconciliation is EMISSION, not transcription:** every step is a signed append to `burndown/events.jsonl`; the ledger regenerates from the fold. Transcribing any of it by hand is BLOCKED (`rules/knowledge-convergence.md` MUST-1).

1. **Do NOT read the prior ledger, and do NOT re-transcribe it.** Carry-forward is a property of the FOLD. Citing a read of the prior ledger as evidence of carry-forward is BLOCKED, and re-emitting an unchanged item "to be safe" is BLOCKED — a live-weight event asserts an observation this session, so emitting one for untouched work manufactures the observation.
2. **Close with receipt** — emit a `kind: "transition"` event per item delivered, keyed on its `item_id`, carrying a durable receipt (PR #N / bare #N / SHA / journal NNNN) per `verify-resource-existence.md` MUST-4. No `item_id` or no receipt → NOT closed, and the event MUST NOT be emitted. An agent MUST NOT emit an owner status (`Signed off`, …) — `validateEvent` refuses an `authority: "agent"` transition carrying one (`rules/burndown-traceability.md` MUST-4, enforced structurally).
3. **Grow** — emit a `kind: "transition"` event with a FRESH UNIQUE `item_id` and a `value_anchor` citing a `value-prioritization.md` MUST-1 user-anchored source (brief / spec § / journal DECISION / user quote). No value-anchor → request it from the user, never invent one. Never reuse a retired id, never renumber.
4. **Empty forest** is rendered by the GENERATOR. Hand-writing "Forest empty" while the fold holds open rows is BLOCKED; absence ≠ done.
5. **Roll LEGACY workspace ledgers up to root (#669)** — every OPEN workspace-ledger id the latest `/sweep` Sweep-6 `--aggregate` flagged STRANDED MUST be emitted as an event WITH its value-anchor (`value-prioritization.md` MUST-2) OR closed per step 2. CONSUMES the `[AGG]` findings already in context; re-scanning is BLOCKED by the cap.
6. **A refused append is LOUD, never silently lost.** `appendEvent` returns a typed refusal; surface it verbatim and do NOT proceed as though the transition were recorded. Reporting a wrapup complete over a refused append is BLOCKED (`rules/zero-tolerance.md` Rule 3).

Why carry-forward became implicit, why re-emission is blocked, and the refusal taxonomy: `skills/wrapup/SKILL.md` § 5. **Mechanical gate (CI / `/redteam`, NOT the wrapup runtime):** `validate-forest-ledger.mjs <notes>` — intra-file conformance; `--git-prior` is the ONLY form enforcing the no-silent-vanish invariant (step 2), `--aggregate` its cross-file twin (step 5). What each flag does and does NOT claim: `skills/wrapup/SKILL.md` § 2.

## Closure — five refusal conditions (MUST)

Reporting `/wrapup` complete is BLOCKED while ANY of these holds. Each is the structural half of an obligation that was previously prose. State, in the reply, that each was cleared before declaring done.

1. **No fresh sweep receipt after the sweep step, and no `--no-sweep <reason>`** (§ Gate) — including a sweep step whose report was not committed or whose Decision points were not shown.
2. **A census CONTAINER with no disposition, or a backlog shown only as totals**, or a container line written while the census reports `complete: false` with its UNKNOWN classes unnamed (§ Container census).
3. **Open work that exists only in session context** — a workstream with no `burndown/events.jsonl` event, an item with no `todos/active/` file, a decision with no `journal/` entry. Emit the event or write the todo FIRST; the notes carry POINTERS, never the only copy.
4. **No burndown chart in the reply** — neither the printed block, the generator's refusal line, nor an explicit UNKNOWN (§ Burndown chart).
5. **No handoff block, or one missing its `START HERE:` or `LAND FIRST:` line** (§ Handoff block).

## Hard rules

- **Write, not verify (closed allowlist — EXACTLY these six tool calls).** **(a)** one optional `ls workspaces/` — ONLY to orient the "Read first" pointers; **(b)** one batched `appendEvent` call emitting ALL of this session's ledger transitions; **(c)** one write of the `.session-notes` fragment; **(d)** one write of `.wave-tracker.d/<display_id>.md` — memory-sourced, NO read; **(e)** one close-out gate invocation running EXACTLY the three commands in § Gate; **(f)** one burndown render per § Burndown chart. **Tool call cap: 6.** ANY other tool call — any additional read of any file, any grep / git / gh / pytest / find — is BLOCKED. The allowlist is the operative bound; this is not a denylist with examples. `--handoff` mode's cap is **1**. Slots (e) and (f) are BOUNDED measurements whose output IS a required section of the deliverable, not verification reads: each runs once and confers NO further read budget, and re-running any command, running `--check`, or reading any file they name stays BLOCKED — **with ONE exception: after a sweep step, the gate's three commands run once more as slot (e′)**, because the sweep changed the answer the gate reads. The sweep step itself precedes the write phase and is outside this allowlist.

  **The generated-projection carve-out.** Regenerating `.session-notes.shared.md` from the fold does NOT count against the cap and is NOT optional where events were emitted — it is a generated-surface operation, the same class as (d), not a verification read. Bounded to ONE regeneration, conferring NO read budget: reading the regenerated projection back, or reading the event log, stays BLOCKED. **Slot (b) formerly held the prior-`.session-notes` read for ledger carry-forward; that read is RETIRED, not re-spent** — carry-forward is now a property of the fold, so the read lost its justification and its slot funds the emission.

- **Memory only, outside slots (e) and (f).** Produce the notes from conversation memory. If unsure whether a claim is still true, omit it — the next session can discover it from git.
- **No LOCAL accomplishments list — but "Executed this session" IS required.** The next session reads `git log` for LOCAL work, so do NOT describe what happened in THIS repo. The carve-out is consequential EXTERNAL actions, which are not in this repo's `git log` and cannot be recovered there. Test: "is this action's state visible in `git log` of THIS repo?" — yes → omit; no → it belongs in the execution-signal. **RUNNING background agents fall under the SAME carve-out** — an agent still executing at wrapup time is in-flight state absent from `git log`, so a `/clear`-resumed session would re-launch the same wave; document them in the **Wave tracker** file (`rules/wave-loop.md` MUST-6), which owns them.
- **No itemized-todo list — but the forest ledger is REQUIRED.** The next session reads `todos/active/` for per-task itemization. The ledger is the scoped exception: forest-level only (workstreams / blocked-items, typically 2–6 rows). Every row carries a value-anchor (`rules/value-prioritization.md` MUST-1+2). Itemizing todos in the ledger is BLOCKED; omitting the ledger entirely is BLOCKED.
- **Every next-session directive ships its own re-validation check — no check, no directive.** The directives section is the ONE imperative surface in the notes (`rules/session-notes-continuity.md` MUST-1); every other section is descriptive. Cap **5**. "None — nothing carries forward" is a VALID and expected answer, not a box to fill. Un-checkable content is context → **Traps**, never a directive. Running the checks now is BLOCKED by the cap, and these are NOT a counted burn-down (`rules/burn-down-reporting.md` MUST-3 fences that off this surface entirely). DO / DO-NOT + BLOCKED corpus: `skills/wrapup/SKILL.md` § 3.
- **The in-play inventory records WHERE the work LIVES — enumerate UNFILTERED, rank by CONTENT, report only the at-risk set.** `git branch --no-merged` MUST NOT be the enumeration source: it excludes any ref tip-equal to main, which is exactly what an abandoned mid-flight branch looks like once main catches up. Enumerate with `git for-each-ref refs/heads` and use `--no-merged` only to RANK (`skills/sweep/SKILL.md` § 5). Durability is decided by CONTENT — `git cherry origin/main <branch>` (`+` lines) — NEVER by ahead-count, which still reads "ahead" for a rebased or cherry-picked branch. Report ONLY branches with content-absent commits AND no merged PR, each marked `pushed | LOCAL-ONLY`; a full-forest dump is BLOCKED, and LOCAL-ONLY + content-absent is called out separately as the sole unrecoverable class. Worktrees get a COUNT plus reap verdicts, with the load-bearing fact inline: removal deletes a DIRECTORY, never a branch (`rules/worktree-isolation.md` Rule 8). Memory-sourced, and the commands are authored for the NEXT session to run. This surface RECORDS what was in play; `/sweep` (Sweeps 4 and 6) is what MEASURES it, so neither replaces the other. DO / DO-NOT + BLOCKED corpus: `skills/wrapup/SKILL.md` § 4.
- **No decision log.** Journal decisions with `/journal` BEFORE running `/wrapup`.
- **No quantitative claims.** Do not write "N tests passing", "3 files changed", or "27 todos remaining" from memory. Point at the source of truth instead. The mandated POINTER-scale counts are the scoped exception and MUST NOT be dropped by citing this rule: the Wave-tracker line's `K`/`M` (`rules/burn-down-reporting.md` MUST-3 § Scope) and the in-play worktree tree-count + reap verdicts. **Figures RENDERED BY A GENERATOR — the fold's projection, the close-out census, and the burndown block — are a second scoped exception on a different ground:** they are not authored claims at all, so the ban, which fences MEMORY-SOURCED numbers, never reached them. They carry `rules/burndown-integrity.md`'s generated-and-quoted property, and the condition is exact: such a figure MUST be QUOTED VERBATIM from the generated output, never recomputed, restated, rounded, or summarised in prose. A recomputed or re-worded generator figure is a memory-sourced claim wearing a generated figure's authority and is BLOCKED. Branch COMMIT counts are NOT exempt under either carve-out — they are the ahead-count this surface forbids outright.
- **No oversight checklist.** Verification commands belong in the next session's task list, not the notes.
- **Bounded output** per `rules/session-notes-continuity.md` MUST-3. If the ledger is what pushes past the ceiling, the items are too granular — collapse to workstreams and push detail to `todos/active/`.
- **Overwrite the PROJECTION and the FRAGMENT; NEVER the LOG.** Overwrite applies to `.session-notes.d/<display_id>.md` and the regenerated `.session-notes.shared.md` — for those, only the latest matters. It does NOT extend to `burndown/events.jsonl`, which is APPEND-ONLY: overwriting, rewriting, reordering, compacting or hand-editing the log is BLOCKED (`rules/burndown-traceability.md` MUST-6). "Only the latest matters" is a statement about a RENDERING, never about the record it is rendered from — the log is the only surface here from which a prior state can still be recovered.
- **"Read first" and the handoff block are the two sections that MUST be present.** Without the first the next session has no entry point; without the second the operator has nothing to paste into `/pickup`. If you cannot produce a useful "Read first", point at `CLAUDE.md` as the sole entry and say why.
'''
tools = ["read_file", "glob", "grep_search", "list_directory", "run_shell_command", "write_file"]
